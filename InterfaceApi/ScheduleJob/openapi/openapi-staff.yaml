      tags:
        - 权限组（角色）与菜单管理。
      summary: 同级菜单排序
      operationId: postStaffRoleApiInterfaceSortMenus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId:
                  type: integer
                  description: '父菜单 ID，0 表示顶级分组'
