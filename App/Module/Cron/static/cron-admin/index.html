<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule Job Admin</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-ui@2.15.14/lib/theme-chalk/index.css">
  <link rel="stylesheet" href="/cron-admin/assets/css/common.css">
  <link rel="stylesheet" href="/cron-admin/assets/css/pages.css?v=user-grant-dialog-1">
  <link rel="stylesheet" href="/cron-admin/assets/css/auth.css?v=menu-sort-1">
</head>
<body>
<div id="app" v-cloak>
  <div class="auth-page" v-if="isAuthPage">
    <router-view></router-view>
  </div>
  <div class="app" v-else>
    <aside class="sidebar">
      <div class="brand">Schedule Job<small>Production Admin</small></div>
      <nav class="nav">
        <div v-for="group in navMenus" :key="'nav-group-' + group.id">
          <div class="nav-section">{{ group.name }}</div>
          <router-link
            v-for="item in (group.children || [])"
            :key="'nav-item-' + item.id"
            :to="menuLink(item.uri)"
          >
            <i :class="item.icon || 'el-icon-document'"></i> {{ item.name }}
          </router-link>
        </div>
      </nav>
    </aside>
    <main class="main">
      <div class="top">
        <div class="top-bar">
          <div>
            <div class="top-inner">
              <div class="breadcrumb">{{ breadcrumbPath }}</div>
              <h1 class="title">{{ pageTitle }}</h1>
              <p class="subtitle" v-if="pageSubtitle">{{ pageSubtitle }}</p>
            </div>
            <div class="top-skeleton" aria-hidden="true">
              <span class="top-skeleton-line"></span>
              <span class="top-skeleton-line lg"></span>
              <span class="top-skeleton-line sm"></span>
            </div>
          </div>
          <div class="user-bar" v-if="currentUser">
            <el-dropdown trigger="click" @command="onUserCommand">
              <span class="name user-name-link">{{ currentUser.userName || currentUser.account }}<i class="el-icon-arrow-down el-icon--right"></i></span>
              <el-dropdown-menu slot="dropdown">
                <el-dropdown-item command="password"><i class="el-icon-key"></i> 重置密码</el-dropdown-item>
                <el-dropdown-item command="profile"><i class="el-icon-user"></i> 个人设置</el-dropdown-item>
              </el-dropdown-menu>
            </el-dropdown>
            <el-button size="mini" plain @click="logout">退出</el-button>
          </div>
          <el-dialog title="重置密码" :visible.sync="settingsDlg" width="440px" append-to-body @closed="resetPasswordForm">
            <p class="section-desc" style="margin:0 0 14px">修改当前账号密码，需校验旧密码。</p>
            <el-form class="reset-password-form" label-width="108px" size="small" @submit.native.prevent="submitPassword">
              <el-form-item label="旧密码" required>
                <el-input v-model="passwordForm.oldPassword" type="password" show-password autocomplete="current-password"></el-input>
              </el-form-item>
              <el-form-item label="新密码" required>
                <el-input v-model="passwordForm.newPassword" type="password" show-password autocomplete="new-password" placeholder="至少 8 位"></el-input>
              </el-form-item>
              <el-form-item label="确认新密码" required>
                <el-input v-model="passwordForm.newPasswordConfirm" type="password" show-password autocomplete="new-password" @keyup.enter.native="submitPassword"></el-input>
              </el-form-item>
            </el-form>
            <div slot="footer">
              <el-button @click="settingsDlg = false">取消</el-button>
              <el-button type="primary" :loading="passwordSaving" @click="submitPassword">提交</el-button>
            </div>
          </el-dialog>
          <el-dialog title="个人设置" :visible.sync="profileDlg" width="440px" append-to-body>
            <p class="section-desc" style="margin:0 0 14px">可修改显示名称。账号仅能由有用户编辑权限的人在用户管理中修改。</p>
            <el-form class="reset-password-form" label-width="108px" size="small" @submit.native.prevent="submitProfile">
              <el-form-item label="账号">
                <el-input :value="profileForm.account" disabled></el-input>
              </el-form-item>
              <el-form-item label="用户名称" required>
                <el-input v-model="profileForm.userName" autocomplete="name" placeholder="显示名称" @keyup.enter.native="submitProfile"></el-input>
              </el-form-item>
            </el-form>
            <div slot="footer">
              <el-button @click="profileDlg = false">取消</el-button>
              <el-button type="primary" :loading="profileSaving" @click="submitProfile">保存</el-button>
            </div>
          </el-dialog>
        </div>
      </div>
      <div class="content-area"><router-view></router-view></div>
    </main>
  </div>
</div>

<script type="text/x-template" id="tpl-dashboard">
  <div>
    <div class="dashboard-scope" v-loading="scopeLoading">
      <div v-if="scopeGroups.length" class="panel dashboard-scope-panel">
        <div class="dashboard-scope-title"><i class="el-icon-collection-tag"></i> 数据聚合范围</div>
        <p class="dashboard-scope-desc">以下 Dashboard 数据基于您有权限的节点分组聚合统计：</p>
        <div class="dashboard-scope-tags">
          <el-tag v-for="g in scopeGroups" :key="'scope-group-' + g.id" size="small" type="info">{{ g.groupName }}</el-tag>
        </div>
      </div>
      <el-alert
        v-else-if="showNoGroupAssigned"
        title="暂无分配节点分组"
        type="warning"
        :closable="false"
        show-icon
      ></el-alert>
    </div>
    <div class="stat-row">
      <div class="panel stat-card"><div>任务总数</div><h2>{{ overview.tasks.total }}</h2><div class="meta"><span class="status-mark status-enabled">启用 {{ overview.tasks.enabled }}</span> / <span class="status-mark status-disabled">禁用 {{ overview.tasks.disabled }}</span></div></div>
      <div class="panel stat-card"><div>今日执行</div><h2>{{ overview.executions.today }}</h2><div class="meta"><span class="status-mark status-success">成功 {{ overview.executions.success }}</span> / <span class="status-mark status-failed">失败 {{ overview.executions.failed }}</span> / <span class="status-mark status-timeout">超时 {{ overview.executions.timeout || 0 }}</span></div></div>
      <div class="panel stat-card"><div>跳过</div><h2>{{ overview.executions.skipped }}</h2><div class="meta"><span class="status-mark status-skipped">今日 SKIP</span></div></div>
      <div class="panel stat-card"><div>节点</div><h2>{{ overview.nodes.total }}</h2><div class="meta"><span class="status-mark status-online">在线 {{ overview.nodes.online }}</span> / <span class="status-mark status-offline">离线 {{ overview.nodes.offline }}</span></div></div>
    </div>
    <div class="panel">
      <div class="page-head" style="margin-bottom:12px">
        <b>执行趋势</b>
        <el-radio-group v-model="range" size="mini" @change="loadTrend">
          <el-radio-button label="24h">24h</el-radio-button>
          <el-radio-button label="7d">7d</el-radio-button>
          <el-radio-button label="15d">15d</el-radio-button>
        </el-radio-group>
      </div>
      <el-table :data="trend" size="small">
        <el-table-column prop="time" label="时间"></el-table-column>
        <el-table-column prop="total" label="总计"></el-table-column>
        <el-table-column prop="success" label="成功">
          <template slot-scope="s"><span class="status-mark status-success">{{ s.row.success }}</span></template>
        </el-table-column>
        <el-table-column prop="failed" label="失败">
          <template slot-scope="s"><span class="status-mark status-failed">{{ s.row.failed }}</span></template>
        </el-table-column>
        <el-table-column prop="timeout" label="超时">
          <template slot-scope="s"><span class="status-mark status-timeout">{{ s.row.timeout }}</span></template>
        </el-table-column>
        <el-table-column prop="skipped" label="跳过">
          <template slot-scope="s"><span class="status-mark status-skipped">{{ s.row.skipped }}</span></template>
        </el-table-column>
      </el-table>
    </div>
  </div>
</script>

<script type="text/x-template" id="tpl-tasks">
  <div>
    <div class="page-head">
      <div></div>
      <div class="actions"><el-button type="primary" icon="el-icon-plus" @click="$router.push('/tasks/create')">创建任务</el-button></div>
    </div>
    <div class="panel">
      <el-form :inline="true" size="small" @submit.native.prevent="search">
        <el-form-item label="任务名称"><el-input v-model="query.keyword" clearable placeholder="任务名称"></el-input></el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" clearable placeholder="全部" style="width:110px">
            <el-option :value="1" label="启用"></el-option>
            <el-option :value="0" label="禁用"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="节点分组">
          <el-select v-model="query.groupId" clearable placeholder="全部" style="width:140px" @change="onFilterGroupChange">
            <el-option v-for="g in groupOptions" :key="'tg-'+g.id" :value="g.id" :label="g.groupName"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="节点">
          <el-select
            v-model="query.nodeId"
            clearable
            :disabled="!filterGroupSelected"
            :placeholder="filterGroupSelected ? '全部' : '请先选择分组'"
            style="width:160px"
          >
            <el-option v-for="n in filteredNodes" :key="n.id" :value="n.id" :label="n.nodeName"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="query.execType" clearable placeholder="全部" style="width:130px">
            <el-option :value="1" label="GLUE 模式"></el-option>
            <el-option :value="2" label="HTTP"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item><el-button type="primary" @click="search">查询</el-button></el-form-item>
      </el-form>
      <el-table
        ref="taskTable"
        class="task-list-table"
        :data="items"
        row-key="id"
        style="width: 100%"
        v-loading="loading"
        empty-text="暂无任务"
        @selection-change="sel=$event"
      >
        <el-table-column type="selection" width="42"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="140"></el-table-column>
        <el-table-column prop="expression" label="Expression" width="140">
          <template slot-scope="s"><span class="mono">{{ s.row.expression }}</span><el-tag size="mini" style="margin-left:6px">{{ s.row.expressionType }}</el-tag></template>
        </el-table-column>
        <el-table-column label="Command" min-width="160" class-name="command-col">
          <template slot-scope="s">
            <span
              class="mono command-preview"
              :class="{ 'text-muted': !commandOf(s.row), 'is-truncated': isCommandTruncated(s.row) }"
              @mouseenter="showCommandTip($event, s.row)"
              @mousemove="moveCommandTip($event)"
              @mouseleave="hideCommandTip"
            >{{ commandPreview(s.row) }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="groupName" label="节点分组" width="120" show-overflow-tooltip>
          <template slot-scope="s"><span :class="groupNameOf(s.row) !== '-' ? '' : 'text-muted'">{{ groupNameOf(s.row) }}</span></template>
        </el-table-column>
        <el-table-column label="节点名称" min-width="130" show-overflow-tooltip>
          <template slot-scope="s">
            <span :class="nodeNameOf(s.row) !== '-' ? '' : 'text-muted'">{{ nodeNameOf(s.row) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="Type" width="110">
          <template slot-scope="s"><el-tag size="mini" :type="s.row.execType===2?'warning':'primary'">{{ s.row.execType===2?'HTTP':'GLUE模式' }}</el-tag></template>
        </el-table-column>
        <el-table-column label="Status" width="120">
          <template slot-scope="s">
            <div class="task-status-switch">
              <el-switch :key="'st-'+s.row.id+'-'+s.row.status" :value="s.row.status" :active-value="1" :inactive-value="0" @change="value => toggle(s.row, value)"></el-switch>
              <span>{{ s.row.status===1?'启用':'禁用' }}</span>
            </div>
          </template>
        </el-table-column>
        <el-table-column prop="retry" label="Retry" width="70"></el-table-column>
        <el-table-column label="下次执行" width="170">
          <template slot-scope="s">
            <span class="next-run-at" :class="{ 'text-muted': formatNextRun(s.row) === '-' }">{{ formatNextRun(s.row) }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="updatedAt" label="Updated" width="160"></el-table-column>
        <el-table-column label="操作" width="330" fixed="right">
          <template slot-scope="s">
            <div class="task-action-group">
              <el-button size="mini" class="task-action-btn btn-detail" @click="$router.push('/tasks/detail/'+s.row.id)">详情</el-button>
              <el-button size="mini" class="task-action-btn btn-edit" @click="$router.push('/tasks/edit/'+s.row.id)">编辑</el-button>
              <el-button size="mini" class="task-action-btn btn-run" @click="runOnce(s.row)">手动执行</el-button>
              <el-button size="mini" class="task-action-btn btn-log" @click="$router.push('/executions?taskId='+s.row.id)">查看日志</el-button>
              <!-- 复制功能临时隐藏，仅展示层下线，保留前端方法/后端接口便于恢复 -->
              <el-button size="mini" class="task-action-btn btn-delete" @click="remove(s.row)">删除</el-button>
            </div>
          </template>
        </el-table-column>
      </el-table>
      <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <el-button size="mini" :disabled="!sel.length" @click="batch(1)">批量启用</el-button>
          <el-button size="mini" :disabled="!sel.length" @click="batch(0)">批量停用</el-button>
        </div>
        <el-pagination background layout="total, prev, pager, next" :total="total" :page-size="query.pageSize" :current-page.sync="query.page" @current-change="load"></el-pagination>
      </div>
    </div>
    <div
      v-show="commandTip.visible"
      class="cron-command-float-tip"
      :style="commandTipStyle"
    >{{ commandTip.text }}</div>
  </div>
</script>

<script type="text/x-template" id="tpl-editor">
  <div class="task-editor-page">
    <div class="page-head">
      <div></div>
      <div class="actions">
        <el-button @click="cancel">取消</el-button>
        <el-button type="primary" :loading="saving" @click="save">保存任务</el-button>
      </div>
    </div>
    <div class="editor-layout">
      <div class="panel task-editor-form">
        <section class="section">
          <h2 class="section-title">基础信息</h2>
          <div class="section-desc">任务名称和节点决定任务的管理归属。</div>
          <div class="grid">
            <div class="field">
              <label>任务名称 <span class="required-mark">*</span></label>
              <input class="form-control" v-model="form.name" placeholder="例如：订单同步">
              <div class="help">任务名称必须唯一。</div>
            </div>
            <div class="field">
              <label>节点分组 <span class="required-mark">*</span></label>
              <select class="form-select" v-model.number="selectedGroupId" @change="onGroupChange">
                <option v-for="g in groupOptions" :key="'eg-'+g.id" :value="g.id">{{ g.groupName }}</option>
              </select>
              <div class="help" v-if="!groupOptions.length">请先在 Cron Nodes「节点分组」页创建分组。</div>
            </div>
            <div class="field">
              <label>执行节点 <span class="required-mark">*</span></label>
              <select class="form-select" v-model.number="form.nodeId" :disabled="!nodesInGroup.length">
                <option v-if="!form.nodeId" disabled :value="null">请选择节点</option>
                <option v-for="n in nodesInGroup" :key="n.id" :value="n.id">{{ n.nodeName }}（{{ n.nodeIp }}）</option>
              </select>
            </div>
            <div class="field full">
              <label>描述</label>
              <textarea class="form-textarea" v-model="form.description" placeholder="描述这个计划任务的用途"></textarea>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">调度配置</h2>
          <div class="section-desc">Swoolefy Cron 支持秒级 Interval 与 Linux Cron 两种表达式。</div>
          <div class="expr-types">
            <div class="expr-type" :class="{active: exprType==='interval'}" @click="setExprType('interval')">
              <div class="radio"><i class="radio-dot"></i>每 N 秒</div>
              <small>适合 5s、15s、30s 等高频任务</small>
            </div>
            <div class="expr-type" :class="{active: exprType==='cron'}" @click="setExprType('cron')">
              <div class="radio"><i class="radio-dot"></i>Linux Cron</div>
              <small>分钟级标准 Cron 表达式</small>
            </div>
          </div>
          <div v-if="exprType==='interval'">
            <div class="grid">
              <div class="field">
                <label>执行间隔（秒） <span class="required-mark">*</span></label>
                <input class="form-control" type="number" min="5" v-model.number="intervalSec">
                <div class="help">例如 15 表示每 15 秒执行一次（引擎下限 5 秒）。</div>
              </div>
              <div class="field">
                <label>表达式</label>
                <input class="form-control mono" :value="String(intervalSec||15)" readonly>
              </div>
            </div>
          </div>
          <div v-else>
            <div class="field">
              <label>Linux Cron 表达式 <span class="required-mark">*</span></label>
              <input class="form-control mono" v-model="cronExpr" placeholder="*/5 * * * *">
              <div class="help">分钟级标准 Linux Cron，例如 <span class="mono">*/5 * * * *</span> 表示每 5 分钟执行。</div>
            </div>
          </div>
          <div class="expr-preview">
            <div :class="preview.valid ? 'valid' : 'invalid'">{{ preview.valid ? '✓ 表达式有效' : '✗ 表达式无效' }}</div>
            <div>{{ preview.description || '-' }}</div>
            <div class="next-runs">
              <span v-for="t in preview.nextRuns" :key="t">{{ t }}</span>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">执行配置</h2>
          <div class="section-desc">选择任务执行类型。不同类型使用不同执行参数。</div>
          <div class="field field-gap-bottom">
            <label>执行类型 <span class="required-mark">*</span></label>
            <div class="segmented">
              <label><input type="radio" name="execType" :checked="form.execType===1" @change="setExecType('shell')"><span>GLUE模式</span></label>
              <label><input type="radio" name="execType" :checked="form.execType===2" @change="setExecType('http')"><span>HTTP</span></label>
            </div>
          </div>
          <div v-if="form.execType===1">
            <div class="field">
              <label>Command <span class="required-mark">*</span></label>
              <textarea class="form-textarea mono" v-model="form.command" placeholder="/bin/bash /opt/scripts/task.sh"></textarea>
              <div class="help-stack">
                <div class="help">Shell Command 将由目标 Agent Cron Node 执行，请确认命令来源可信。</div>
                <div class="help">支持java、python、go，php</div>
              </div>
            </div>
          </div>
          <div v-else>
            <div class="grid">
              <div class="field full">
                <label>Request URL <span class="required-mark">*</span></label>
                <input class="form-control" v-model="form.command" placeholder="http://127.0.0.1:9501/index/index">
              </div>
              <div class="field">
                <label>HTTP Method</label>
                <select class="form-select" v-model="form.httpMethod">
                  <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
                </select>
              </div>
              <div class="field">
                <label>Timeout（秒）</label>
                <input class="form-control" type="number" min="0" v-model.number="form.httpRequestTimeOut">
              </div>
              <div class="field full">
                <label>HTTP Headers</label>
                <textarea class="form-textarea mono" v-model="headersText" placeholder='{"Content-Type":"application/json"}'></textarea>
              </div>
              <div class="field full">
                <label>HTTP Body</label>
                <textarea class="form-textarea mono" v-model="bodyText" placeholder='{"type":"incremental"}'></textarea>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">执行策略</h2>
          <div class="section-desc">控制任务是否允许重叠，以及允许 / 跳过执行的时间范围。</div>
          <div class="toggle-row toggle-row-gap-bottom">
            <div><b>阻塞重叠执行</b><div class="help">上一次执行尚未完成时，不再启动新的执行。</div></div>
            <label class="toggle"><input type="checkbox" :checked="form.withBlockLapping===1" @change="form.withBlockLapping = $event.target.checked ? 1 : 0"><i class="slider"></i></label>
          </div>
          <div class="grid">
            <div class="field">
              <label>允许执行时间段 cron_between</label>
              <div class="time-range-list">
                <div class="time-range-head">
                  <span class="help">留空表示不限制。</span>
                  <button type="button" class="btn-inline" @click="addBetweenItem">添加时段</button>
                </div>
                <div v-if="!betweenItems.length" class="time-range-empty">暂无时段</div>
                <div v-for="(item, idx) in betweenItems" :key="'between-'+idx" class="time-range-item">
                  <input class="form-control mono" v-model="item.start" placeholder="start，例如 09:00">
                  <input class="form-control mono" v-model="item.end" placeholder="end，例如 18:00">
                  <button type="button" class="btn-inline danger" @click="removeBetweenItem(idx)">删除</button>
                </div>
              </div>
              <div class="help">留空表示不限制。</div>
            </div>
            <div class="field">
              <label>跳过时间段 cron_skip</label>
              <div class="time-range-list">
                <div class="time-range-head">
                  <span class="help">命中跳过时间段时，本次调度直接跳过。</span>
                  <button type="button" class="btn-inline" @click="addSkipItem">添加时段</button>
                </div>
                <div v-if="!skipItems.length" class="time-range-empty">暂无时段</div>

            <input class="form-control" type="number" min="0" v-model.number="form.retry">

          <el-button type="danger" plain @click="remove">删除任务</el-button>
          <el-button @click="cancel">取消</el-button>

        </div>
      </div>

      <aside class="panel preview-card">
        <div class="preview-head">
          <div class="preview-title">任务预览</div>
          <span class="badge" :class="{disabled: form.status!==1}">{{ form.status===1?'启用':'禁用' }}</span>
        </div>
        <div class="task-name">{{ form.name || '未命名任务' }}</div>
        <div class="task-desc">{{ form.description || '暂无描述' }}</div>
        <div class="kv"><span>执行节点</span><b>{{ nodeLabel }}</b></div>
        <div class="kv"><span>调度类型</span><b>{{ exprType==='interval'?'每 N 秒':'Linux Cron' }}</b></div>
        <div class="kv"><span>表达式</span><b class="mono">{{ form.expression }}</b></div>
        <div class="kv"><span>执行类型</span><b>{{ form.execType===2?'HTTP':'GLUE模式' }}</b></div>
        <div class="kv"><span>防重叠</span><b>{{ form.withBlockLapping?'是':'否' }}</b></div>
        <div class="kv"><span>Retry</span><b>{{ form.retry }}</b></div>
        <div class="callout">
          <b>配置链路</b><br>
          保存后只写入 <span class="mono">cron_task</span>。Cron Worker 通过数据库 Polling 发现配置变化，再更新 Runtime Job / Timer。
        </div>
        <div class="callout info">
          <b>生产提示</b><br>
          Shell Command 属于高风险配置；HTTP Headers 中的 Token / Cookie 等敏感信息不应在列表接口中明文返回。
        </div>
      </aside>
    </div>
  </div>
</script>
