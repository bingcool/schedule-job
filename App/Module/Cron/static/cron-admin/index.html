<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schedule Job Admin</title>
  <link rel="stylesheet" href="/cron-admin/assets/vendor/element-ui/theme-chalk/index.css">
  <link rel="stylesheet" href="/cron-admin/assets/css/common.css?v=app-header-4">
  <link rel="stylesheet" href="/cron-admin/assets/css/pages.css?v=expr-switch-gap-1">
  <link rel="stylesheet" href="/cron-admin/assets/css/auth.css?v=temp-pwd-mark-1">
</head>
<body>
<div id="app" v-cloak>
  <div class="auth-page" v-if="isAuthPage">
    <router-view></router-view>
  </div>
  <div class="app" v-else>
    <aside class="sidebar">
      <div class="brand">Schedule Job<small>Cron Task System</small></div>
      <nav class="nav">
        <div v-for="group in navMenus" :key="'nav-group-' + group.id">
          <div class="nav-section">{{ group.name }}</div>
          <router-link
            v-for="item in (group.children || [])"
            :key="'nav-item-' + item.id"
            :to="menuLink(item.uri)"
          >
            <i :class="item.icon || 'el-icon-document'"></i> {{ item.name }}
          </router-link>
        </div>
      </nav>
    </aside>
    <div class="app-main">
      <header class="app-header">
        <div class="user-bar" v-if="currentUser">
          <el-dropdown trigger="click" @command="onUserCommand">
            <span class="name user-name-link">{{ currentUser.userName || currentUser.account }}<i class="el-icon-arrow-down el-icon--right"></i></span>
            <el-dropdown-menu slot="dropdown">
              <el-dropdown-item command="password"><i class="el-icon-key"></i> 重置密码</el-dropdown-item>
              <el-dropdown-item command="profile"><i class="el-icon-user"></i> 个人设置</el-dropdown-item>
            </el-dropdown-menu>
          </el-dropdown>
          <el-tooltip v-if="tempPasswordHint" :content="tempPasswordHint" placement="bottom">
            <span class="temp-password-mark">❗</span>
          </el-tooltip>
          <el-button size="mini" plain @click="logout">退出</el-button>
        </div>
        <el-dialog title="重置密码" :visible.sync="settingsDlg" width="440px" append-to-body @closed="resetPasswordForm">
          <p class="section-desc" style="margin:0 0 14px">修改当前账号密码，需校验旧密码。</p>
          <el-form class="reset-password-form" label-width="108px" size="small" @submit.native.prevent="submitPassword">
            <el-form-item label="旧密码" required>
              <el-input v-model="passwordForm.oldPassword" type="password" show-password autocomplete="current-password"></el-input>
            </el-form-item>
            <el-form-item label="新密码" required>
              <el-input v-model="passwordForm.newPassword" type="password" show-password autocomplete="new-password" placeholder="至少 8 位"></el-input>
            </el-form-item>
            <el-form-item label="确认新密码" required>
              <el-input v-model="passwordForm.newPasswordConfirm" type="password" show-password autocomplete="new-password" @keyup.enter.native="submitPassword"></el-input>
            </el-form-item>
          </el-form>
          <div slot="footer">
            <el-button @click="settingsDlg = false">取消</el-button>
            <el-button type="primary" :loading="passwordSaving" @click="submitPassword">提交</el-button>
          </div>
        </el-dialog>
        <el-dialog title="个人设置" :visible.sync="profileDlg" width="440px" append-to-body>
          <p class="section-desc" style="margin:0 0 14px">可修改显示名称。账号仅能由有用户编辑权限的人在用户管理中修改。</p>
          <el-form class="reset-password-form" label-width="108px" size="small" @submit.native.prevent="submitProfile">
            <el-form-item label="账号">
              <el-input :value="profileForm.account" disabled></el-input>
            </el-form-item>
            <el-form-item label="用户名称" required>
              <el-input v-model="profileForm.userName" autocomplete="name" placeholder="显示名称" @keyup.enter.native="submitProfile"></el-input>
            </el-form-item>
          </el-form>
          <div slot="footer">
            <el-button @click="profileDlg = false">取消</el-button>
            <el-button type="primary" :loading="profileSaving" @click="submitProfile">保存</el-button>
          </div>
        </el-dialog>
      </header>
    <main class="main">
      <div class="top">
        <div class="top-inner">
          <div class="breadcrumb">{{ breadcrumbPath }}</div>
          <h1 class="title">{{ pageTitle }}</h1>
          <p class="subtitle" v-if="pageSubtitle">{{ pageSubtitle }}</p>
        </div>
        <div class="top-skeleton" aria-hidden="true">
          <span class="top-skeleton-line"></span>
          <span class="top-skeleton-line lg"></span>
          <span class="top-skeleton-line sm"></span>
        </div>
      </div>
      <div class="content-area"><router-view></router-view></div>
    </main>
    </div>
  </div>
</div>

<script type="text/x-template" id="tpl-dashboard">
  <div>
    <div class="dashboard-scope" v-loading="scopeLoading">
      <div v-if="scopeGroups.length" class="panel dashboard-scope-panel">
        <div class="dashboard-scope-title"><i class="el-icon-collection-tag"></i> 数据聚合范围</div>
        <p class="dashboard-scope-desc">以下 Dashboard 数据基于您有权限的节点分组聚合统计：</p>
        <div class="dashboard-scope-tags">
          <el-tag v-for="g in scopeGroups" :key="'scope-group-' + g.id" size="small" type="info">{{ g.groupName }}</el-tag>
        </div>
      </div>
      <el-alert
        v-else-if="showNoGroupAssigned"
        title="暂无分配节点分组"
        type="warning"
        :closable="false"
        show-icon
      ></el-alert>
    </div>
    <div class="stat-row">
      <div class="panel stat-card"><div>任务总数</div><h2>{{ overview.tasks.total }}</h2><div class="meta"><span class="status-mark status-enabled">启用 {{ overview.tasks.enabled }}</span> / <span class="status-mark status-disabled">禁用 {{ overview.tasks.disabled }}</span></div></div>
      <div class="panel stat-card"><div>今日执行({{ todayDate }})</div><h2>{{ overview.executions.today }}</h2><div class="meta"><span class="status-mark status-success">成功 {{ overview.executions.success }}</span> / <span class="status-mark status-failed">失败 {{ overview.executions.failed }}</span> / <span class="status-mark status-timeout">超时 {{ overview.executions.timeout || 0 }}</span> / <span class="status-mark status-cancelled">取消 {{ overview.executions.cancelled || 0 }}</span></div></div>
      <div class="panel stat-card"><div>今日跳过({{ todayDate }})</div><h2>{{ overview.executions.skipped }}</h2><div class="meta"><span class="status-mark status-skipped">今日 SKIP</span></div></div>
      <div class="panel stat-card"><div>节点</div><h2>{{ overview.nodes.total }}</h2><div class="meta"><span class="status-mark status-online">在线 {{ overview.nodes.online }}</span> / <span class="status-mark status-offline">离线 {{ overview.nodes.offline }}</span></div></div>
    </div>
    <div class="panel">
      <div class="page-head dash-trend-head">
        <div class="dash-trend-left">
        <b>执行趋势</b>
        <el-radio-group v-model="range" size="mini" @change="loadTrend">
          <el-radio-button label="24h">24h</el-radio-button>
          <el-radio-button label="7d">7d</el-radio-button>
          <el-radio-button label="15d">15d</el-radio-button>
        </el-radio-group>
      </div>
        <el-radio-group class="exec-view-switch" v-model="viewMode" size="mini" @change="onViewModeChange">
          <el-radio-button label="list"><i class="el-icon-s-operation"></i> 列表</el-radio-button>
          <el-radio-button label="chart"><i class="el-icon-data-line"></i> 折线图</el-radio-button>
        </el-radio-group>
      </div>
      <el-table v-show="viewMode==='list'" :data="trend" size="small">
        <el-table-column prop="time" label="时间"></el-table-column>
        <el-table-column prop="total" label="总计"></el-table-column>
        <el-table-column prop="success" label="成功">
          <template slot-scope="s"><span class="status-mark status-success">{{ s.row.success }}</span></template>
        </el-table-column>
        <el-table-column prop="failed" label="失败">
          <template slot-scope="s"><span class="status-mark status-failed">{{ s.row.failed }}</span></template>
        </el-table-column>
        <el-table-column prop="timeout" label="超时">
          <template slot-scope="s"><span class="status-mark status-timeout">{{ s.row.timeout }}</span></template>
        </el-table-column>
        <el-table-column prop="cancelled" label="取消">
          <template slot-scope="s"><span class="status-mark status-cancelled">{{ s.row.cancelled || 0 }}</span></template>
        </el-table-column>
        <el-table-column prop="skipped" label="跳过">
          <template slot-scope="s"><span class="status-mark status-skipped">{{ s.row.skipped }}</span></template>
        </el-table-column>
      </el-table>
      <div v-show="viewMode==='chart'" class="exec-chart-wrap" v-loading="trendLoading">
        <div class="exec-chart-legend">
          <span v-for="s in chartSeries" :key="s.key" class="exec-chart-legend-item">
            <i class="exec-chart-swatch" :style="{ background: s.color }"></i>
            {{ s.label }} {{ chartTotals[s.key] || 0 }}
          </span>
        </div>
        <div v-if="!trend.length" class="exec-chart-empty">暂无成功 / 失败 / 超时 / 取消数据</div>
        <div v-else ref="dashChartBox" class="exec-chart" @mousemove="onChartMove" @mouseleave="onChartLeave">
          <svg :width="chartModel.width" :height="chartModel.height">
            <line
              v-for="g in chartModel.gridY"
              :key="'gy-'+g.y"
              class="exec-chart-grid"
              :x1="chartModel.pad.l"
              :x2="chartModel.width - chartModel.pad.r"
              :y1="g.y"
              :y2="g.y"
            ></line>
            <text
              v-for="g in chartModel.gridY"
              :key="'yl-'+g.y"
              class="exec-chart-axis"
              :x="chartModel.pad.l - 8"
              :y="g.y + 4"
              text-anchor="end"
            >{{ g.label }}</text>
            <text
              v-for="t in chartModel.xLabels"
              :key="'xl-'+t.i"
              class="exec-chart-axis"
              :x="t.x"
              :y="chartModel.height - 12"
              text-anchor="middle"
            >{{ t.label }}</text>
            <polyline
              v-for="s in chartModel.lines"
              :key="'line-'+s.key"
              class="exec-chart-line"
              fill="none"
              :stroke="s.color"
              stroke-width="2"
              stroke-linejoin="round"
              stroke-linecap="round"
              :points="s.points"
            ></polyline>
            <circle
              v-for="d in chartModel.dots"
              :key="'dot-'+d.key"
              :cx="d.x"
              :cy="d.y"
              r="3"
              :fill="d.color"
            ></circle>
            <line
              v-if="hoverIndex>=0 && chartModel.hoverX!=null"
              class="exec-chart-guide"
              :x1="chartModel.hoverX"
              :x2="chartModel.hoverX"
              :y1="chartModel.pad.t"
              :y2="chartModel.height - chartModel.pad.b"
            ></line>
          </svg>
          <div
            v-if="hoverIndex>=0 && hoverTip"
            class="exec-chart-tooltip"
            :style="{ left: hoverTip.left + 'px', top: hoverTip.top + 'px' }"
          >
            <div class="exec-chart-tip-time">{{ hoverTip.time }}</div>
            <div v-for="s in chartSeries" :key="'tip-'+s.key">
              <i class="exec-chart-swatch" :style="{ background: s.color }"></i>
              {{ s.label }} {{ hoverTip.values[s.key] }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</script>

<script type="text/x-template" id="tpl-tasks">
  <div>
    <div class="page-head">
      <div></div>
      <div class="actions">
        <el-button type="primary" icon="el-icon-plus" @click="$router.push('/tasks/create')">创建任务</el-button>
        <el-button icon="el-icon-document" @click="$router.push('/tasks/operation-logs')">操作记录</el-button>
      </div>
    </div>
    <div class="panel">
      <el-form :inline="true" size="small" @submit.native.prevent="search">
        <el-form-item label="任务名称"><el-input v-model="query.keyword" clearable placeholder="任务名称"></el-input></el-form-item>
        <el-form-item label="状态">
          <el-select v-model="query.status" clearable placeholder="全部" style="width:110px">
            <el-option :value="1" label="启用"></el-option>
            <el-option :value="0" label="禁用"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="节点分组">
          <el-select v-model="query.groupId" clearable placeholder="全部" style="width:140px" @change="onFilterGroupChange">
            <el-option v-for="g in groupOptions" :key="'tg-'+g.id" :value="g.id" :label="g.groupName"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="节点">
          <el-select
            v-model="query.nodeId"
            clearable
            :disabled="!filterGroupSelected"
            :placeholder="filterGroupSelected ? '全部' : '请先选择分组'"
            style="width:160px"
          >
            <el-option v-for="n in filteredNodes" :key="n.id" :value="n.id" :label="n.nodeName"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="类型">
          <el-select v-model="query.execType" clearable placeholder="全部" style="width:130px">
            <el-option :value="1" label="GLUE 模式"></el-option>
            <el-option :value="2" label="HTTP"></el-option>
            <el-option :value="3" label="Kubernetes"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item label="创建人">
          <el-select v-model="query.createdBy" clearable filterable placeholder="全部" style="width:180px">
            <el-option
              v-for="c in creatorOptions"
              :key="c.staffUserId"
              :value="Number(c.staffUserId)"
              :label="c.staffUserName"
            ></el-option>
          </el-select>
        </el-form-item>
        <el-form-item><el-button type="primary" @click="search">查询</el-button></el-form-item>
      </el-form>
      <el-table
        ref="taskTable"
        class="task-list-table"
        :data="items"
        row-key="id"
        style="width: 100%"
        v-loading="loading"
        empty-text="暂无任务"
        @selection-change="sel=$event"
      >
        <el-table-column type="selection" width="42"></el-table-column>
        <el-table-column prop="name" label="名称" min-width="140"></el-table-column>
        <el-table-column prop="expression" label="Expression" width="140">
          <template slot-scope="s"><span class="mono">{{ s.row.expression }}</span><el-tag size="mini" style="margin-left:6px">{{ s.row.expressionType }}</el-tag></template>
        </el-table-column>
        <el-table-column label="Command" min-width="160" class-name="command-col">
          <template slot-scope="s">
            <span
              class="mono command-preview"
              :class="{ 'text-muted': !commandOf(s.row), 'is-truncated': isCommandTruncated(s.row) }"
              @mouseenter="showCommandTip($event, s.row)"
              @mousemove="moveCommandTip($event)"
              @mouseleave="hideCommandTip"
            >{{ commandPreview(s.row) }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="groupName" label="节点分组" width="120" show-overflow-tooltip>
          <template slot-scope="s"><span :class="groupNameOf(s.row) !== '-' ? '' : 'text-muted'">{{ groupNameOf(s.row) }}</span></template>
        </el-table-column>
        <el-table-column label="节点名称" min-width="180">
          <template slot-scope="s">
            <div class="task-node-cell">
            <span :class="nodeNameOf(s.row) !== '-' ? '' : 'text-muted'">{{ nodeNameOf(s.row) }}</span>
              <span
                v-if="nodeStatusOf(s.row)"
                class="status-pill"
                :class="nodeStatusOf(s.row) === 'online' ? 'status-online' : 'status-offline'"
              >{{ nodeStatusOf(s.row) === 'online' ? 'online' : 'offline' }}</span>
            </div>
          </template>
        </el-table-column>
        <el-table-column label="Type" width="110">
          <template slot-scope="s"><el-tag size="mini" :type="s.row.execType===2?'warning':(s.row.execType===3?'success':'primary')">{{ s.row.execType===2?'HTTP':(s.row.execType===3?'Kubernetes':'GLUE模式') }}</el-tag></template>
        </el-table-column>
        <el-table-column label="Status" width="120">
          <template slot-scope="s">
            <div
              class="task-status-switch"
              :class="{ 'is-forbidden': !canManageTask(s.row) }"
              @click="onStatusSwitchClick(s.row)"
            >
              <el-switch
                :key="'st-'+s.row.id+'-'+s.row.status"
                :value="s.row.status"
                :active-value="1"
                :inactive-value="0"
                :disabled="!canManageTask(s.row)"
                @change="value => toggle(s.row, value)"
              ></el-switch>
              <span>{{ s.row.status===1?'启用':'禁用' }}</span>
            </div>
          </template>
        </el-table-column>
        <el-table-column prop="retry" label="Retry" width="70"></el-table-column>
        <el-table-column label="超时" width="80">
          <template slot-scope="s">{{ s.row.timeout > 0 ? (s.row.timeout + 's') : '-' }}</template>
        </el-table-column>
        <el-table-column label="下次执行" width="170">
          <template slot-scope="s">
            <span class="next-run-at" :class="{ 'text-muted': formatNextRun(s.row) === '-' }">{{ formatNextRun(s.row) }}</span>
          </template>
        </el-table-column>
        <el-table-column label="创建人" width="110" show-overflow-tooltip>
          <template slot-scope="s">
            <span :class="creatorNameOf(s.row) !== '-' ? '' : 'text-muted'">{{ creatorNameOf(s.row) }}</span>
          </template>
        </el-table-column>
        <el-table-column prop="createdAt" label="创建时间" width="160"></el-table-column>
        <el-table-column prop="updatedAt" label="更新时间" width="160"></el-table-column>
        <el-table-column label="操作" width="240" fixed="right">
          <template slot-scope="s">
            <div class="task-action-group">
              <el-button size="mini" class="task-action-btn btn-detail" @click="$router.push('/tasks/detail/'+s.row.id)">详情</el-button>
              <el-button
                size="mini"
                class="task-action-btn btn-edit"
                :class="{ 'is-forbidden': !canManageTask(s.row) }"
                @click="guardEdit(s.row)"
              >编辑</el-button>
              <el-button
                size="mini"
                class="task-action-btn btn-run"
                :class="{ 'is-forbidden': !canManageTask(s.row) }"
                @click="runOnce(s.row)"
              >手动执行</el-button>
              <el-button size="mini" class="task-action-btn btn-log" @click="$router.push('/executions?taskId='+s.row.id)">查看日志</el-button>
              <el-button
                v-if="isViewerSuper()"
                size="mini"
                class="task-action-btn btn-transfer"
                @click="openTransferOwner(s.row)"
              >更改权限所属人</el-button>
              <!-- 复制功能临时隐藏，仅展示层下线，保留前端方法/后端接口便于恢复 -->
              <el-button
                size="mini"
                class="task-action-btn btn-delete"
                :class="{ 'is-forbidden': !canManageTask(s.row) }"
                @click="remove(s.row)"
              >删除</el-button>
            </div>
          </template>
        </el-table-column>
      </el-table>
      <el-dialog title="更改权限所属人" :visible.sync="ownerDlg" width="480px" append-to-body>
        <p style="margin:0 0 12px;color:var(--muted);font-size:13px">
          任务「{{ ownerTask && ownerTask.name }}」的权限将转移给所选用户；仅可选择已授权节点分组「{{ groupNameOf(ownerTask || {}) }}」的用户。
        </p>
        <el-select
          v-model="ownerForm.userId"
          filterable
          popper-append-to-body
          placeholder="选择用户"
          style="width:100%"
        >
          <el-option
            v-for="u in ownerUserOptions"
            :key="'owner-u-' + u.id"
            :value="Number(u.id)"
            :label="(u.userName || u.account) + '（' + u.account + '）'"
          ></el-option>
        </el-select>
        <div slot="footer">
          <el-button @click="ownerDlg = false">取消</el-button>
          <el-button type="primary" :loading="ownerSaving" @click="saveTransferOwner">确定</el-button>
        </div>
      </el-dialog>
      <div style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <el-button
            size="mini"
            :class="{ 'is-forbidden': !canBatchManage() }"
            :disabled="!sel.length"
            @click="guardBatch(1)"
          >批量启用</el-button>
          <el-button
            size="mini"
            :class="{ 'is-forbidden': sel.length && !canBatchManage() }"
            :disabled="!sel.length"
            @click="guardBatch(0)"
          >批量停用</el-button>
        </div>
        <el-pagination background layout="total, prev, pager, next" :total="total" :page-size="query.pageSize" :current-page.sync="query.page" @current-change="load"></el-pagination>
      </div>
    </div>
    <div
      v-show="commandTip.visible"
      class="cron-command-float-tip"
      :style="commandTipStyle"
    >{{ commandTip.text }}</div>
  </div>
</script>

<script type="text/x-template" id="tpl-editor">
  <div class="task-editor-page">
    <div class="page-head">
      <div></div>
      <div class="actions">
        <el-button @click="cancel">取消</el-button>
        <el-button type="primary" :loading="saving" :disabled="readOnly" @click="save">{{ isEdit ? '保存任务' : '创建任务' }}</el-button>
      </div>
    </div>
    <div class="editor-layout">
      <div class="panel task-editor-form">
        <section class="section">
          <h2 class="section-title">基础信息</h2>
          <div class="section-desc">任务名称和节点决定任务的管理归属。</div>
          <div class="grid">
            <div class="field">
              <label>任务名称 <span class="required-mark">*</span></label>
              <input class="form-control" v-model="form.name" placeholder="例如：订单同步">
              <div class="help">任务名称必须唯一。</div>
            </div>
            <div class="field">
              <label>节点分组 <span class="required-mark">*</span></label>
              <select class="form-select" v-model.number="selectedGroupId" @change="onGroupChange">
                <option v-for="g in groupOptions" :key="'eg-'+g.id" :value="g.id">{{ g.groupName }}</option>
              </select>

            </div>
            <div class="field">
              <label>执行节点 <span class="required-mark">*</span></label>
              <select class="form-select" v-model.number="form.nodeId" :disabled="!nodesInGroup.length">
                <option v-if="!form.nodeId" disabled :value="null">请选择节点</option>
                <option v-for="n in nodesInGroup" :key="n.id" :value="n.id">{{ n.nodeName }}（{{ n.nodeIp }}）</option>
              </select>
            </div>
            <div class="field full">
              <label>描述</label>
              <textarea class="form-textarea" v-model="form.description" placeholder="描述这个计划任务的用途"></textarea>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">调度配置</h2>
          <div class="section-desc">Swoolefy Cron 支持秒级 Interval 与 Linux Cron 两种表达式。</div>
          <div class="expr-switch" :class="'is-' + exprType">
          <div class="expr-types">
            <div class="expr-type" :class="{active: exprType==='cron'}" @click="setExprType('cron')">
              <div class="radio"><i class="radio-dot"></i>Linux Cron</div>
              <small>分钟级标准 Cron 表达式</small>
            </div>
              <div class="expr-type" :class="{active: exprType==='interval'}" @click="setExprType('interval')">
                <div class="radio"><i class="radio-dot"></i>每 N 秒</div>
                <small>适合 5s、15s、30s 等高频任务</small>
          </div>
            </div>
            <div class="expr-panel">
          <div v-if="exprType==='interval'">
            <div class="grid">
              <div class="field">
                <label>执行间隔（秒） <span class="required-mark">*</span></label>
                <input class="form-control" type="number" min="5" v-model.number="intervalSec">
                <div class="help">例如 15 表示每 15 秒执行一次（引擎下限 5 秒）。</div>
              </div>
              <div class="field">
                <label>表达式</label>
                <input class="form-control mono" :value="String(intervalSec||15)" readonly>
              </div>
            </div>
          </div>
          <div v-else>
            <div class="field">
              <label>Linux Cron 表达式 <span class="required-mark">*</span></label>
              <input class="form-control mono" v-model="cronExpr" placeholder="*/5 * * * *">
              <div class="help">分钟级标准 Linux Cron，例如 <span class="mono">*/5 * * * *</span> 表示每 5 分钟执行。</div>
            </div>
          </div>
          <div class="expr-preview">
            <div :class="preview.valid ? 'valid' : 'invalid'">{{ preview.valid ? '✓ 表达式有效' : '✗ 表达式无效' }}</div>
            <div>{{ preview.description || '-' }}</div>
            <div class="next-runs">
              <span v-for="t in preview.nextRuns" :key="t">{{ t }}</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">执行配置</h2>
          <div class="section-desc">选择任务执行类型。不同类型使用不同执行参数。</div>
          <div class="field field-gap-bottom">
            <label>执行类型 <span class="required-mark">*</span></label>
            <div class="segmented">
              <label><input type="radio" name="execType" :checked="form.execType===1" @change="setExecType('shell')"><span>GLUE模式</span></label>
              <label><input type="radio" name="execType" :checked="form.execType===2" @change="setExecType('http')"><span>HTTP</span></label>
              <label><input type="radio" name="execType" :checked="form.execType===3" @change="setExecType('k8s')"><span>Kubernetes</span></label>
            </div>
          </div>
          <div v-if="form.execType===3">
            <div class="k8s-principle">到点后 Agent 读取该 Deployment 当前的 Pod 模板，派生一次性 Job 跑下面的命令；不保存镜像，发布只改 Deployment。</div>
            <div class="grid">
              <div class="field">
                <label>Namespace <span class="required-mark">*</span></label>
                <input class="form-control mono" v-model="k8s.namespace" placeholder="请输入 k8s 部署 yaml 的 Namespace">
                <div class="help">请输入 k8s 部署 yaml 的 Namespace（须在该 Agent 节点的 K8S_ALLOWED_NAMESPACES 白名单内）。</div>
              </div>
              <div class="field">
                <label>Deployment <span class="required-mark">*</span></label>
                <input class="form-control mono" v-model="k8s.deployment" placeholder="order-service">
                <div class="help">执行时即时读取它的 spec.template，不保存镜像版本。</div>
              </div>
              <div class="field full">
                <label>Container</label>
                <input class="form-control mono" v-model="k8s.container" placeholder="order-service">
                <div class="help">多容器 Deployment 必填；单容器可留空自动选中。Sidecar 不会被复制。</div>
              </div>
              <div class="field">
                <label>Command（每行一个参数） <span class="required-mark">*</span></label>
                <textarea class="form-textarea mono" v-model="k8sCommandText"></textarea>
                <div class="help-stack">
                  <div class="help">每行一个参数，不是一行 shell。</div>
                  <div class="help">eg：<span class="mono">/usr/bin/php</span></div>
                </div>
              </div>
              <div class="field">
                <label>Args（每行一个参数） <span class="required-mark">*</span></label>
                <textarea class="form-textarea mono" v-model="k8sArgsText"></textarea>
                <div class="help-stack">
                  <div class="help">每行一个参数。</div>
                  <div class="help">eg：<br><span class="mono">script.php</span><br><span class="mono">start</span><br><span class="mono">Test</span><br><span class="mono">--c=test:script</span></div>
                </div>
              </div>
              <div class="field full">
                <label>完整执行脚本</label>
                <input class="form-control mono" :value="k8sScriptPreview" readonly>
                <div class="help">由上面 Command 与 Args 动态拼接，仅用于展示。</div>
              </div>
              <div class="field full">
                <label>Job 超时（秒） <span class="required-mark">*</span></label>
                <input class="form-control" type="number" min="1" v-model.number="form.timeout" @input="timeoutUserEdited = true">
                <div class="help-stack">
                  <div class="help" v-if="k8sTimeoutHoursHint">{{ k8sTimeoutHoursHint }}</div>
                  <div class="help">默认超时时间随表达式变化不同：分钟级默认600s，小时级默认3600s，按天默认21600s(6个小时)，其他默认7200s(2个小时)</div>
                  <div class="help">Kubernetes 任务必须填写：Agent 用一个协程等 Job 结束，没有上限就会被永久占用。</div>
                  <div class="help">到期后 schedule-job 会删除该 Job（连带删 Pod），并记为 TIMEOUT。</div>
                  <div class="help">需要评估自身业务来设置这个时间，长时间任务需要设置足够大。</div>
                </div>
              </div>
            </div>
          </div>
          <div v-else-if="form.execType===1">
            <div class="field">
              <label>Command <span class="required-mark">*</span></label>
              <textarea class="form-textarea mono" v-model="form.command" placeholder="/bin/bash /opt/scripts/task.sh"></textarea>
              <div class="help-stack">
                <div class="help">Shell Command 将由目标 Agent Cron Node 执行，请确认命令来源可信。</div>
                <div class="help">支持java、python、go，php</div>
                <div class="help">如需异步执行脚本，可以使用 nohup，例如 <span class="mono">nohup /path/python3 async_task.py &gt; /path/to/logs/async_task.log 2&gt;&amp;1 &amp;</span>。请先验证脚本可行后，再添加。</div>
              </div>
            </div>
          </div>
          <div v-else>
            <div class="grid">
              <div class="field full">
                <label>Request URL <span class="required-mark">*</span></label>
                <input class="form-control" v-model="form.command" placeholder="http://127.0.0.1:9501/index/index">
              </div>
              <div class="field">
                <label>HTTP Method</label>
                <select class="form-select" v-model="form.httpMethod">
                  <option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option>
                </select>
              </div>
              <div class="field">
                <label>Timeout（秒）</label>
                <input class="form-control" type="number" min="0" v-model.number="form.httpRequestTimeOut">
              </div>
              <div class="field full">
                <label>HTTP Headers</label>
                <textarea class="form-textarea mono" v-model="headersText" placeholder='{"Content-Type":"application/json"}'></textarea>
              </div>
              <div class="field full">
                <label>HTTP Body</label>
                <textarea class="form-textarea mono" v-model="bodyText" placeholder='{"type":"incremental"}'></textarea>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">执行策略</h2>
          <div class="section-desc">控制任务是否允许重叠，以及允许 / 跳过执行的时间范围。</div>
          <div class="toggle-row toggle-row-gap-bottom">
            <div><b>阻塞重叠执行</b><div class="help">上一次执行尚未完成时，不再启动新的执行。</div></div>
            <label class="toggle"><input type="checkbox" :checked="form.withBlockLapping===1" @change="form.withBlockLapping = $event.target.checked ? 1 : 0"><i class="slider"></i></label>
          </div>
          <div class="grid">
            <div class="field">
              <label>允许执行时间段 cron_between</label>
              <div class="time-range-list">
                <div class="time-range-head">
                  <span class="help">留空表示不限制。</span>
                  <button type="button" class="btn-inline" @click="addBetweenItem">添加时段</button>
                </div>
                <div v-if="!betweenItems.length" class="time-range-empty">暂无时段</div>
                <div v-for="(item, idx) in betweenItems" :key="'between-'+idx" class="time-range-item">
                  <input class="form-control mono" v-model="item.start" placeholder="start，例如 09:00">
                  <input class="form-control mono" v-model="item.end" placeholder="end，例如 18:00">
                  <button type="button" class="btn-inline danger" @click="removeBetweenItem(idx)">删除</button>
                </div>
              </div>
              <div class="help">留空表示不限制。</div>
            </div>
            <div class="field">
              <label>跳过时间段 cron_skip</label>
              <div class="time-range-list">
                <div class="time-range-head">
                  <span class="help">命中跳过时间段时，本次调度直接跳过。</span>
                  <button type="button" class="btn-inline" @click="addSkipItem">添加时段</button>
                </div>
                <div v-if="!skipItems.length" class="time-range-empty">暂无时段</div>
                <div v-for="(item, idx) in skipItems" :key="'skip-'+idx" class="time-range-item">
                  <input class="form-control mono" v-model="item.start" placeholder="start，例如 12:00">
                  <input class="form-control mono" v-model="item.end" placeholder="end，例如 13:00">
                  <button type="button" class="btn-inline danger" @click="removeSkipItem(idx)">删除</button>
                </div>
              </div>
              <div class="help">命中跳过时间段时，本次调度直接跳过。</div>
            </div>
          </div>
          <div class="field field-gap-top">
            <label>失败重试</label>
            <input class="form-control" type="number" min="0" max="1" v-model.number="form.retry">
            <div class="help">不含首次；0=不重试，1=失败后再试一次。</div>
          </div>
          <div class="field field-gap-top" v-if="form.execType===1">
            <label>Shell 超时（秒）</label>
            <input class="form-control" type="number" min="0" v-model.number="form.timeout">
            <div class="help-stack">
              <div class="help">仅 GLUE/Shell；0=不限制。到期 SIGTERM，grace 后 SIGKILL。</div>
              <div class="help">除非很明确任务可能跑很长时间的，否则不建议设置这个超时，容易误杀正在运行的脚本。</div>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">任务状态</h2>
          <div class="toggle-row">
            <div><b>{{ isEdit ? '启用任务' : '创建后立即启用' }}</b><div class="help">启用后 Worker 下次 Polling 会加载该任务。</div></div>
            <label class="toggle"><input type="checkbox" :checked="form.status===1" @change="form.status = $event.target.checked ? 1 : 0"><i class="slider"></i></label>
          </div>
        </section>

        <div class="footer-actions" v-if="isEdit">
          <el-button type="danger" plain @click="remove">删除任务</el-button>
          <el-button @click="cancel">取消</el-button>
          <el-button type="primary" :loading="saving" @click="save">保存任务</el-button>
        </div>
      </div>

      <aside class="panel preview-card">
        <div class="preview-head">
          <div class="preview-title">任务预览</div>
          <span class="badge" :class="{disabled: form.status!==1}">{{ form.status===1?'启用':'禁用' }}</span>
        </div>
        <div class="task-name">{{ form.name || '未命名任务' }}</div>
        <div class="task-desc">{{ form.description || '暂无描述' }}</div>
        <div class="kv"><span>执行节点</span><b>{{ nodeLabel }}</b></div>
        <div class="kv"><span>调度类型</span><b>{{ exprType==='interval'?'每 N 秒':'Linux Cron' }}</b></div>
        <div class="kv"><span>表达式</span><b class="mono">{{ form.expression }}</b></div>
        <div class="kv"><span>执行类型</span><b>{{ execTypeLabel }}</b></div>
        <div class="kv"><span>防重叠</span><b>{{ form.withBlockLapping?'是':'否' }}</b></div>
        <div class="kv"><span>Retry</span><b>{{ form.retry }}</b></div>
        <div class="kv" v-if="form.execType===1"><span>Shell 超时</span><b>{{ form.timeout > 0 ? (form.timeout + 's') : '不限制' }}</b></div>
        <div class="kv" v-if="form.execType===3"><span>Job 超时</span><b>{{ form.timeout > 0 ? (form.timeout + 's') : '未设置' }}</b></div>
        <div class="kv" v-if="form.execType===3"><span>目标</span><b class="mono">{{ k8sSummary }}</b></div>
        <div class="kv" v-if="form.execType===3"><span>镜像</span><b>执行当下从 Deployment 读取，不保存在任务配置中</b></div>
        <div class="callout">
          <b>配置链路</b><br>
          保存后只写入 <span class="mono">cron_task</span>。Cron Worker 通过数据库 Polling 发现配置变化，再更新 Runtime Job / Timer。
        </div>
        <div class="callout info">
          <b>生产提示</b><br>
          Shell Command 属于高风险配置；HTTP Headers 中的 Token / Cookie 等敏感信息不应在列表接口中明文返回。
        </div>
      </aside>
    </div>
  </div>
</script>

                    @change="value => onStatusChange(group, value)"
                  ></el-switch>
                  <span>{{ group.status === 1 ? '启用' : '禁用' }}</span>
                </div>
                <el-button type="text" size="mini" @click="openDialog(group, true)">新增菜单</el-button>
                <el-button type="text" size="mini" @click="openDialog(group)">编辑</el-button>
                <el-button type="text" size="mini" style="color:#f87171" @click="remove(group)">删除</el-button>
              </div>
            </div>
            <div
              class="menu-nav-items"
              ref="itemLists"
              :data-group-id="group.id"
            >
              <div
                v-for="item in (group.children || [])"
                :key="item.id"
                class="menu-nav-item-row"
                :class="{ 'is-disabled': isMenuDisabled(item) }"
              >
                <span class="menu-drag-handle menu-drag-handle--item" title="拖动排序"><i class="el-icon-rank"></i></span>
                <i :class="item.icon || 'el-icon-document'"></i>
                <span class="label">{{ item.name }}</span>
                <span class="mono uri">{{ item.uri }}</span>
                <div class="menu-nav-item-status">
                  <el-switch
                    :key="'menu-st-item-' + item.id + '-' + item.status"
                    :value="item.status"
                    :active-value="1"
                    :inactive-value="0"
                    @change="value => onStatusChange(item, value)"
                  ></el-switch>
                  <span>{{ item.status === 1 ? '启用' : '禁用' }}</span>
                </div>
                <el-button type="text" size="mini" @click="openDialog(item)">编辑</el-button>
                <el-button type="text" size="mini" style="color:#f87171" @click="remove(item)">删除</el-button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="560px">
      <el-form label-width="100px" size="small">
        <el-form-item label="所属分组" v-if="!isGroupForm">
          <el-select v-model="menuForm.parentId" placeholder="选择分组" style="width:100%">
            <el-option v-for="g in groupOptions" :key="g.id" :value="g.id" :label="g.name"></el-option>
          </el-select>
        </el-form-item>
        <el-form-item :label="isGroupForm ? '分组名称' : '菜单名称'" required><el-input v-model="menuForm.name" :placeholder="isGroupForm ? '如：Cron 管理' : '显示名称'"></el-input></el-form-item>
        <el-form-item label="唯一标识" required><el-input v-model="menuForm.code" :placeholder="isGroupForm ? '如 cron' : '如 cron:tasks'"></el-input></el-form-item>
        <el-form-item :label="isGroupForm ? '占位 URI' : 'URI'" :required="!isGroupForm"><el-input v-model="menuForm.uri" :placeholder="isGroupForm ? '/cron（分组占位，不进路由）' : '/tasks'"></el-input></el-form-item>
        <el-form-item label="图标" v-if="!isGroupForm"><el-input v-model="menuForm.icon" placeholder="el-icon-s-order"><template slot="prepend"><i :class="menuForm.icon || 'el-icon-picture'"></i></template></el-input></el-form-item>
        <el-form-item label="排序"><el-input-number v-model="menuForm.sort" :min="0" :max="9999" style="width:160px"></el-input-number></el-form-item>
      </el-form>
      <div slot="footer">
        <el-button @click="dialogVisible = false">取消</el-button>
        <el-button type="primary" @click="save">确定</el-button>
      </div>
    </el-dialog>
  </div>
</script>
