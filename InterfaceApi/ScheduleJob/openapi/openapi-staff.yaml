openapi: 3.0.3
info:
  title: 'schedule-job · Staff'
  description: '后台用户、角色、菜单与认证 API'
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
        - '登录 / 当前用户（公开注册已关闭，用户由管理员在后台创建）。'
      summary: 用户登录
      operationId: postStaffAuthApiInterfaceLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: string
                  description: '登录标识：含 @ 按邮箱验证，否则按账号验证'
                password:
                  type: string
                  description: 密码
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      token: { type: string, description: JWT }
                      tokenType: { type: string, description: 'token 类型' }
                      expiresIn: { type: integer, description: 过期秒数 }
                      user: { type: object, properties: { id: { type: integer, description: '用户 ID' }, account: { type: string, description: 账号 }, email: { type: string, description: 邮箱 }, userName: { type: string, description: 用户名称 }, isSuper: { type: boolean, description: 是否超级管理员 }, isEditorTaskGroup: { type: boolean, description: 是否任务组编辑角色 }, roles: { type: array, items: { type: string }, description: 角色列表 }, nodeGroupIds: { type: array, items: { type: integer }, description: '授权节点组 ID' }, menus: { type: array, items: { type: string }, description: 菜单树 } }, description: 当前用户 }
                      loginMode: { type: string, description: 登录方式：temp=临时重置密码，normal=正常密码 }
                      tempPasswordExpiresAt: { type: string, description: 临时重置密码到期时间，正常登录为空 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/auth/me:
    get:
      tags:
        - '登录 / 当前用户（公开注册已关闭，用户由管理员在后台创建）。'
      summary: 当前登录用户
      operationId: getStaffAuthApiInterfaceMe
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '用户 ID' }
                      account: { type: string, description: 账号 }
                      email: { type: string, description: 邮箱 }
                      userName: { type: string, description: 用户名称 }
                      isSuper: { type: boolean, description: 是否超级管理员 }
                      isEditorTaskGroup: { type: boolean, description: 是否任务组编辑角色 }
                      roles: { type: array, items: { type: string }, description: 角色列表 }
                      nodeGroupIds: { type: array, items: { type: integer }, description: '授权节点组 ID' }
                      menus: { type: array, items: { type: string }, description: 菜单树 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/auth/password:
    post:
      tags:
        - '登录 / 当前用户（公开注册已关闭，用户由管理员在后台创建）。'
      summary: 修改当前用户密码
      operationId: postStaffAuthApiInterfaceChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                  description: 旧密码
                newPassword:
                  type: string
                  description: 新密码
                newPasswordConfirm:
                  type: string
                  description: 确认新密码
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '用户 ID' }
                      changed: { type: boolean, description: 密码是否已修改 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/auth/profile:
    post:
      tags:
        - '登录 / 当前用户（公开注册已关闭，用户由管理员在后台创建）。'
      summary: 修改当前用户资料
      operationId: postStaffAuthApiInterfaceUpdateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userName:
                  type: string
                  description: 用户名称
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '用户 ID' }
                      account: { type: string, description: 账号 }
                      email: { type: string, description: 邮箱 }
                      userName: { type: string, description: 用户名称 }
                      isSuper: { type: boolean, description: 是否超级管理员 }
                      isEditorTaskGroup: { type: boolean, description: 是否任务组编辑角色 }
                      roles: { type: array, items: { type: string }, description: 角色列表 }
                      nodeGroupIds: { type: array, items: { type: integer }, description: '授权节点组 ID' }
                      menus: { type: array, items: { type: string }, description: 菜单树 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/menus:
