    get:
      tags:
        - 权限组（角色）与菜单管理。
      summary: 分页查询角色
      operationId: getStaffRoleApiInterfaceListRoles
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
                      list: { type: array, items: { type: object, properties: { id: { type: integer, description: '角色 ID' }, name: { type: string, description: 角色名称 }, code: { type: string, description: 唯一标识 }, desc: { type: string, description: 描述 }, isSuperRole: { type: boolean, description: 是否超管 }, isSystemRole: { type: boolean, description: 是否系统内置角色 }, status: { type: integer, description: 状态 }, userCount: { type: integer, description: 关联用户数 }, menuCount: { type: integer, description: 菜单权限数 }, pageIds: { type: array, items: { type: integer } }, apiPerIds: { type: array, items: { type: integer } }, taskPerIds: { type: array, items: { type: integer } }, createdAt: { type: string, description: 创建时间 }, updatedAt: { type: string, description: 更新时间 }, menus: { type: array, items: { type: string }, description: 菜单树（详情） }, apiPermissions: { type: array, items: { type: string }, description: 'API 权限目录（详情）' }, taskPermissions: { type: array, items: { type: string }, description: 任务权限目录（详情） } } } }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
    post:
