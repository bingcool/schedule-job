openapi: 3.0.3
info:
  title: 'schedule-job · Cron'
  description: '定时任务、节点、Agent 与机器人告警 API'
  version: 1.0.0
paths:
  /api/v1/agent/heartbeat:
    post:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 'Agent 心跳上报'
      operationId: postCronApiInterfaceAgentHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nodeId:
                  type: integer
                  description: '节点 ID'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      nodeId: { type: integer, description: '回显的 Agent 节点 ID' }
                      serverTime: { type: string, description: '服务端当前时间（Y-m-d H:i:s）' }
                      alive: { type: boolean, description: 是否存活 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/report:
    post:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 'Agent 上报任务执行结果'
      operationId: postCronApiInterfaceAgentReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cronId:
                  type: integer
                  description: 'Cron 任务 ID'
                message:
                  type: string
                  description: 运行日志消息
                taskItem:
                  nullable: true
                  description: 任务项快照（任意结构）
                execBatchId:
                  type: string
                  nullable: true
                  description: '执行批次 ID'
                pid:
                  type: integer
                  nullable: true
                  description: '进程 PID'
                status:
                  type: integer
                  description: '结构化执行状态 0-6；缺省不从 message 猜测'
                triggerType:
                  type: integer
                  description: '触发类型：1-scheduler 2-run_once'
                durationMs:
                  type: integer
                  description: 执行耗时毫秒
                exitCode:
                  type: integer
                  description: 'Shell 退出码'
                httpStatus:
                  type: integer
                  description: 'HTTP 状态码'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      saved: { type: boolean, description: 是否已保存 }
                      cronId: { type: integer, description: 'Cron 任务 ID' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/agent/tasks:
    get:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 'Agent 拉取待执行的定时任务'
      operationId: getCronApiInterfaceAgentTasks
      parameters:
        -
          name: nodeId
          in: query
          required: false
          schema:
            type: integer
          description: '节点 ID'
        -
          name: apiKey
          in: query
          required: false
          schema:
            type: string
          description: '节点 API Key'
        -
          name: execType
          in: query
          required: false
          schema:
            type: integer
            nullable: true
          description: '执行类型：1 shell，2 http；省略则返回全部'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      nodeId: { type: integer, description: '回显的 Agent 节点 ID' }
                      execType: { type: integer, nullable: true, description: '查询时指定的执行类型；全类型查询时为 null' }
                      list: { type: array, items: { nullable: true }, nullable: true, description: '单 execType 模式下的任务列表' }
                      shellTasks: { type: array, items: { nullable: true }, nullable: true, description: '全类型模式下的 shell 任务列表' }
                      httpTasks: { type: array, items: { nullable: true }, nullable: true, description: '全类型模式下的 http 任务列表' }
                      k8sTasks: { type: array, items: { nullable: true }, nullable: true, description: '全类型模式下的 kubernetes 任务列表' }
                      total: { type: integer, description: 任务总条数 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/dashboard/execution-trend:
    get:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 执行趋势
      operationId: getCronApiInterfaceExecutionTrend
      parameters:
        -
          name: range
          in: query
          required: false
          schema:
            type: string
          description: '时间范围：24h / 7d / 15d'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      list: { type: array, items: { type: object, properties: { time: { type: string, description: '桶标签，如 02:00 或 2026-08-17' }, total: { type: integer, description: 总次数 }, success: { type: integer, description: 成功次数 }, failed: { type: integer, description: 失败次数 }, timeout: { type: integer, description: 超时次数 }, skipped: { type: integer, description: 跳过次数 }, cancelled: { type: integer, description: 取消次数 } } }, description: 趋势桶列表 }
                      total: { type: integer, description: 总条数 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/dashboard/overview:
    get:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 'Dashboard 概览'
      operationId: getCronApiInterfaceDashboardOverview
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      tasks: { type: array, items: { type: string }, description: 任务计数 }
                      executions: { type: array, items: { type: string }, description: '今日执行计数：与趋势同源 COUNT(DISTINCT exec_batch_id)；today=success+failed+timeout+cancelled（不含 skipped）' }
                      nodes: { type: array, items: { type: string }, description: '节点计数；online 按各节点 heartbeat_interval 的存活公式判定' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/executions/cancel:
    post:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 取消一次执行
      operationId: postCronApiInterfaceCancelExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: cron_task_log.id
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      executionId: { type: integer, description: '执行日志 ID' }
                      status: { type: string, description: 当前状态名 }
                      alreadyFinished: { type: boolean, description: '是否已结束（Cancel 未被接受）' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/node-groups:
    delete:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 删除节点分组
      operationId: deleteCronApiInterfaceDeleteNodeGroup
      parameters:
        -
          name: id
          in: query
          required: false
          schema:
            type: integer
          description: '分组 ID'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '记录 ID' }
                      deleted: { type: boolean, description: 是否已删除 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
    get:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 查询节点分组列表
      operationId: getCronApiInterfaceListNodeGroups
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      list: { type: array, items: { type: object, properties: { id: { type: integer, description: '分组 ID' }, groupId: { type: integer, description: '分组 ID（与 id 相同，由 cron_agent_node_group.id 映射，非表列 group_id）' }, groupName: { type: string, description: 分组名称 }, remark: { type: string, description: 备注 }, robotId: { type: integer, description: '绑定的机器人 ID；0=不告警' }, robotName: { type: string, description: 绑定的机器人名称；未绑定为空 }, robotPlatform: { type: integer, description: '绑定的机器人平台：1-企微 2-钉钉 3-飞书；未绑定为 0' }, robotStatus: { type: integer, description: '绑定的机器人状态：0-禁用 1-启用；未绑定为 0' }, nodeCount: { type: integer, description: 分组下未软删节点数 }, createdAt: { type: string, description: 创建时间 }, updatedAt: { type: string, description: 更新时间 } } }, description: 节点分组列表 }
                      total: { type: integer, description: 总条数 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
    post:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 创建节点分组
      operationId: postCronApiInterfaceCreateNodeGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupName:
                  type: string
                  description: 分组名称
                remark:
                  type: string
                  nullable: true
                  description: 备注
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '分组 ID' }
                      groupId: { type: integer, description: '分组 ID（与 id 相同，由 cron_agent_node_group.id 映射，非表列 group_id）' }
                      groupName: { type: string, description: 分组名称 }
                      remark: { type: string, description: 备注 }
                      robotId: { type: integer, description: '绑定的机器人 ID；0=不告警' }
                      robotName: { type: string, description: 绑定的机器人名称；未绑定为空 }
                      robotPlatform: { type: integer, description: '绑定的机器人平台：1-企微 2-钉钉 3-飞书；未绑定为 0' }
                      robotStatus: { type: integer, description: '绑定的机器人状态：0-禁用 1-启用；未绑定为 0' }
                      nodeCount: { type: integer, description: 分组下未软删节点数 }
                      createdAt: { type: string, description: 创建时间 }
                      updatedAt: { type: string, description: 更新时间 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
    put:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 更新节点分组
      operationId: putCronApiInterfaceUpdateNodeGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: '分组 ID'
                groupName:
                  type: string
                  description: 分组名称
                remark:
                  type: string
                  nullable: true
                  description: 备注
                robotId:
                  type: integer
                  description: '绑定的机器人 ID；0=不告警；省略则不改'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '分组 ID' }
                      groupId: { type: integer, description: '分组 ID（与 id 相同，由 cron_agent_node_group.id 映射，非表列 group_id）' }
                      groupName: { type: string, description: 分组名称 }
                      remark: { type: string, description: 备注 }
                      robotId: { type: integer, description: '绑定的机器人 ID；0=不告警' }
                      robotName: { type: string, description: 绑定的机器人名称；未绑定为空 }
                      robotPlatform: { type: integer, description: '绑定的机器人平台：1-企微 2-钉钉 3-飞书；未绑定为 0' }
                      robotStatus: { type: integer, description: '绑定的机器人状态：0-禁用 1-启用；未绑定为 0' }
                      nodeCount: { type: integer, description: 分组下未软删节点数 }
                      createdAt: { type: string, description: 创建时间 }
                      updatedAt: { type: string, description: 更新时间 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/node-groups/detail:
    get:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 查询节点分组详情
      operationId: getCronApiInterfaceGetNodeGroup
      parameters:
        -
          name: id
          in: query
          required: false
          schema:
            type: integer
          description: '分组 ID'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '分组 ID' }
                      groupId: { type: integer, description: '分组 ID（与 id 相同，由 cron_agent_node_group.id 映射，非表列 group_id）' }
                      groupName: { type: string, description: 分组名称 }
                      remark: { type: string, description: 备注 }
                      robotId: { type: integer, description: '绑定的机器人 ID；0=不告警' }
                      robotName: { type: string, description: 绑定的机器人名称；未绑定为空 }
                      robotPlatform: { type: integer, description: '绑定的机器人平台：1-企微 2-钉钉 3-飞书；未绑定为 0' }
                      robotStatus: { type: integer, description: '绑定的机器人状态：0-禁用 1-启用；未绑定为 0' }
                      nodeCount: { type: integer, description: 分组下未软删节点数 }
                      createdAt: { type: string, description: 创建时间 }
                      updatedAt: { type: string, description: 更新时间 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/nodes:
    delete:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: '删除 Cron Agent 节点'
      operationId: deleteCronApiInterfaceDeleteNode
      parameters:
        -
          name: id
          in: query
          required: false
          schema:
            type: integer
          description: '节点 ID'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '记录 ID' }
                      deleted: { type: boolean, description: 是否已删除 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
    get:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: '查询 Cron Agent 节点列表'
      operationId: getCronApiInterfaceListNodes
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
