name: InterfaceApi

on:
  push:
    paths:
      - 'InterfaceApi/**'
      - '.github/workflows/interface-api.yml'
  pull_request:
    paths:
      - 'InterfaceApi/**'
      - '.github/workflows/interface-api.yml'

jobs:
  reference-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: InterfaceApi §2 reference boundary
        run: php InterfaceApi/bin/reference-check.php
