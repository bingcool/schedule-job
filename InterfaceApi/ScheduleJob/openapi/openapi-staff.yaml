            type: integer
          description: '菜单 ID'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '记录 ID' }
                      deleted: { type: boolean, description: 是否已删除 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
    get:
      tags:
        - 权限组（角色）与菜单管理。
      summary: 菜单树
      operationId: getStaffRoleApiInterfaceListMenus
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      list: { type: array, items: { type: object, properties: { id: { type: integer, description: '菜单 ID' }, appId: { type: integer, description: '应用 ID' }, name: { type: string, description: 菜单名称 }, parentPrefix: { type: string, description: 父路径 }, parentId: { type: integer, description: '父菜单 ID' }, uri: { type: string, description: URI }, code: { type: string, description: 唯一标识 }, icon: { type: string, description: 图标 }, sort: { type: integer, description: 排序 }, status: { type: integer, description: 状态 }, children: { type: array, items: { type: object }, description: 子菜单 }, createdAt: { type: string, description: 创建时间 } } }, description: 菜单树 }
                      total: { type: integer, description: 总条数 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
    post:
      tags:
        - 权限组（角色）与菜单管理。
      summary: 创建菜单
      operationId: postStaffRoleApiInterfaceCreateMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 菜单名称
                code:
                  type: string
                  description: 唯一标识
                uri:
                  type: string
                  description: '页面 URI'
                icon:
                  type: string
                  description: '图标 class'
                parentId:
                  type: integer
                  description: '父菜单 ID，0 为顶级'
                sort:
                  type: integer
                  description: 排序，越大越靠前
                status:
                  type: integer
                  description: 状态：1=启用，0=禁用
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '菜单 ID' }
                      appId: { type: integer, description: '应用 ID' }
                      name: { type: string, description: 菜单名称 }
                      parentPrefix: { type: string, description: 父路径 }
                      parentId: { type: integer, description: '父菜单 ID' }
                      uri: { type: string, description: URI }
                      code: { type: string, description: 唯一标识 }
                      icon: { type: string, description: 图标 }
                      sort: { type: integer, description: 排序 }
                      status: { type: integer, description: 状态 }
                      children: { type: array, items: { type: object }, description: 子菜单 }
                      createdAt: { type: string, description: 创建时间 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
    put:
      tags:
        - 权限组（角色）与菜单管理。
      summary: 更新菜单
      operationId: putStaffRoleApiInterfaceUpdateMenu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: '菜单 ID'
                name:
                  type: string
                  description: 菜单名称
                code:
                  type: string
                  description: 唯一标识
                uri:
                  type: string
                  description: '页面 URI'
                icon:
                  type: string
                  description: '图标 class'
                parentId:
                  type: integer
                  description: '父菜单 ID，0 为顶级'
                sort:
                  type: integer
                  description: 排序，越大越靠前
                status:
                  type: integer
                  description: 状态：1=启用，0=禁用
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
