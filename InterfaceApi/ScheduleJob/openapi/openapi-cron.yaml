        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 查询任务执行统计
      operationId: getCronApiInterfaceTaskStats
      parameters:
        -
          name: taskId
          in: query
          required: false
          schema:
            type: integer
          description: '任务 ID（cron 任务主键）'
        -
          name: start
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: '开始时间（含 created_at >= start），空表示不限制'
        -
          name: end
          in: query
          required: false
          schema:
            type: string
            nullable: true
          description: '结束时间（不含 created_at < end），空表示不限制'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      taskId: { type: integer, description: '被统计的任务 ID' }
                      total: { type: integer, description: 执行记录总条数 }
                      register: { type: integer, description: register（注册定时任务）次数 }
                      running: { type: integer, description: 'running 次数' }
                      success: { type: integer, description: 成功次数 }
                      failed: { type: integer, description: 失败次数 }
                      skipped: { type: integer, description: 跳过次数 }
                      timeout: { type: integer, description: 超时次数 }
                      cancelled: { type: integer, description: 取消次数 }
                      finished: { type: integer, description: 已结束次数（success+failed+skipped+timeout+cancelled） }
                      attempted: { type: integer, description: '成功率分母（success+failed+timeout+cancelled，不含 skipped）' }
                      successRate: { type: number, description: '成功率（百分比，0–100）；分母为 attempted' }
                      avgDurationMs: { type: number, description: 'SUCCESS 行平均执行耗时（毫秒）' }
                      maxDurationMs: { type: number, description: 'SUCCESS 行最大执行耗时（毫秒）' }
                      samples: { type: integer, description: '参与耗时统计的 SUCCESS 行数' }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
  /api/v1/tasks/status:
    post:
      tags:
        - 'Cron 模块 API（任务、节点、机器人、Agent）'
      summary: 切换定时任务启用状态
      operationId: postCronApiInterfaceSwitchTaskStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: '任务 ID'
                status:
                  type: integer
                  description: '状态：0 禁用，1 启用'
      responses:
        200:
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 0
                  msg:
                    type: string
                    example: success
                  trace_id:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id: { type: integer, description: '已更新状态的任务 ID' }
                      status: { type: integer, description: 更新后的状态：0=禁用，1=启用 }
                required:
                  - code
                  - msg
                  - trace_id
                  - data
        400:
          description: 'validation failed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: -1
                  msg:
                    type: string
                    example: 'validation failed'
                  trace_id:
                    type: string
                    example: ''
                  data:
                    nullable: true
                required:
                  - code
                  - msg
                  - trace_id
                  - data
