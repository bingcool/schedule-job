# 这是一个swoolefy的http基于k8s的部署demo。schedule-job调用k8s的job能力执行任务

# Docker Desktop 本机联调：swoolefy Test Deployment + Agent RBAC
#
# 不要部署到 kube-public。本清单使用独立 Namespace swoolefy。
#
#   kubectl apply -f deploy/kubernetes/local/docker-desktop.yaml
#   kubectl -n swoolefy get pods,svc,sa
#   kubectl create token schedule-job-agent -n swoolefy --duration=8760h
#   其中schedule-job-agent是k8s一个授权访问账号
# 运行时用本机镜像 swoolefy-php85-swoole62:v1（PHP 8.5 + Swoole 6.2）。
# 代码用 hostPath 挂进来：Docker Desktop VM 上的
#   /host_mnt/Users/macbook/Documents/wwwphp  →  /home/wwwroot
# 容器工作目录是 /home/wwwroot/swoolefy，启动 php cli.php start Test。
# 整体流程：
#  创建命名空间 swoolefy，隔离资源。
#
#  创建 ServiceAccount schedule-job-agent，并赋予 RBAC 权限，使其能够操作 Job、Pod 等。
#
#  部署 swoolefy-test：使用本机镜像，通过 hostPath 挂载本机代码，启动 HTTP 服务，监听 9501 端口。
#
#  创建 Service：通过 NodePort 30501 对外暴露服务。
#
#  调度任务（schedule-job）：可以使用 schedule-job-agent 这个 ServiceAccount 的 Token，在 Pod 内调用 K8s API，动态创建 Job 来执行后台任务。注释中给出了创建 Token 的命令：
#
#  bash
#  kubectl create token schedule-job-agent -n swoolefy --duration=8760h
#  这个 Token 可以配置到调度程序中，使其具备创建 Job 的权限。
apiVersion: v1
kind: Namespace
metadata:
  name: swoolefy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schedule-job-agent
  namespace: swoolefy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: schedule-job-agent
  namespace: swoolefy
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: schedule-job-agent
  namespace: swoolefy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: schedule-job-agent
subjects:
  - kind: ServiceAccount
    name: schedule-job-agent
    namespace: swoolefy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swoolefy-test
  namespace: swoolefy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swoolefy-test
  template:
    metadata:
      labels:
        app: swoolefy-test
    spec:
      containers:
        - name: swoolefy-test
          image: swoolefy-php85-swoole62:v1
          # Never 只适合本机联调：镜像只在本机 Docker，没有推仓库。
          # 生产多节点 / 自动扩缩容不要用 Never，应改成仓库镜像 + IfNotPresent（或可变 tag 用 Always），
          # 并配 imagePullSecrets。schedule-job 创建 Job 时会原样继承 Deployment 的这两项，不在这里改。
          imagePullPolicy: Never
          workingDir: /home/wwwroot/swoolefy
          command: ["php", "cli.php", "start", "Test"]
          env:
            - name: PWD
              value: /home/wwwroot/swoolefy
            - name: SKIP_NACOS_FETCH
              value: "1"
            - name: PHP_BIN_FILE
              value: /usr/bin/php
            - name: DB_HOST_NAME
              value: host.docker.internal
            - name: REDIS_HOST
              value: host.docker.internal
          ports:
            - name: http
              containerPort: 9501
          volumeMounts:
            - name: wwwphp
              mountPath: /home/wwwroot
      volumes:
        - name: wwwphp
          hostPath:
            path: /host_mnt/Users/macbook/Documents/wwwphp
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: swoolefy-test
  namespace: swoolefy
spec:
  type: NodePort
  selector:
    app: swoolefy-test
  ports:
    - name: http
      port: 9501
      targetPort: 9501
      nodePort: 30501
